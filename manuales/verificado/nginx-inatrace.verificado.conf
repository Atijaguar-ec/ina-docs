# Configuración Nginx de referencia alineada con el Módulo 01 §7.4
# Requiere /etc/nginx/conf.d/inatrace-ratelimit.conf en el bloque http {}
server {
    listen 80;
    listen [::]:80;
    server_name inatrace.atijaguar.com;
    return 301 https://$server_name$request_uri;
}

server {
    # En Nginx >= 1.25.1 use 'listen 443 ssl;' + 'http2 on;'
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name inatrace.atijaguar.com;

    if ($host != $server_name) {
        return 301 https://$server_name$request_uri;
    }

    ssl_certificate /etc/letsencrypt/live/inatrace.atijaguar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inatrace.atijaguar.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 100M;

    location /auth/ {
        proxy_pass http://127.0.0.1:8082/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /api/public/ {
        limit_req zone=inatrace_public burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8083/api/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8083/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_connect_timeout 90s;
    }

    location / {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
